<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebSocket Demo</title>
        <link rel="stylesheet" href="/main-0.0.1.css">
        <link rel="stylesheet" href="/ws-demo.css">
        <script src="/ws-demo.js" defer></script>
