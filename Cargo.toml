[package]
name = "ceresforge"
version = "0.0.2-dev"
edition = "2024"
rust-version = "1.87"
description = "A web platform for learning, creating, and testing software"
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["ws"] }
axum-extra = { version = "0.12.5", features = ["cookie-private", "typed-header"] }
base64ct = "1.8.3"
clap = { version = "4.6.0", features = ["derive"] }
cookie = { version = "0.18.1", features = ["private"] }
flate2 = "1.1.9"
futures = "0.3.32"
hmac = "0.13.0-rc.6"
hyper-util = "0.1.20"
quick-xml = { version = "0.39.2", features = ["serialize", "serde-types"] }
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
rpassword = "7.4.0"
rsa = { version = "0.10.0-rc.17", features = ["sha2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "time", "uuid"] }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde", "formatting"] }
tokio = { version = "1.50.0", features = ["macros", "process", "rt-multi-thread", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.0", features = ["v4"] }

[build-dependencies]
ureq = "3.3.0"
zip = "8.4.0"

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
