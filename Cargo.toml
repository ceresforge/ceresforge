[package]
name = "ceresforge"
version = "0.0.2-dev"
edition = "2024"
rust-version = "1.87"
description = "A web platform for learning, creating, and testing software"
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["ws"] }
axum-extra = { version = "0.12.3", features = ["cookie-private", "typed-header"] }
base64ct = "1.8.1"
clap = { version = "4.5.53", features = ["derive"] }
flate2 = "1.1.5"
futures = "0.3.31"
hmac = "0.12.1"
quick-xml = { version = "0.38.4", features = ["serialize", "serde-types"] }
rand = "0.10.0-rc.5"
reqwest = { version = "0.12.26", features = ["stream"] }
rpassword = "7.4.0"
rsa = { version = "0.10.0-rc.10", features = ["sha2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "time", "uuid"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde", "formatting"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["v4"] }

[build-dependencies]
ureq = "3.1.4"
zip = "6.0.0"

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
